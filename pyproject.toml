[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "spade-dfl-paper-code"
version = "1.0.0"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.23",
  "scipy>=1.10,<1.14",
  "matplotlib>=3.4",
  "mpmath>=1.3",
  "Pillow>=9.0",
]

[project.scripts]
spade-dfl-paper = "spade_dfl_release.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
